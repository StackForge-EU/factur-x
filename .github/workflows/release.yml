name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate
        run: npm run validate

      - name: Test
        run: npm run test -- --run

      - name: Bump version
        id: version
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")

          node -e "
            const f = require('fs');
            const j = JSON.parse(f.readFileSync('jsr.json', 'utf8'));
            j.version = '${NEW_VERSION}';
            f.writeFileSync('jsr.json', JSON.stringify(j, null, 2) + '\n');
          "
          # JSON.stringify expands the arrays; keep the file prettier-clean so CI passes after the release commit.
          npx prettier --write jsr.json

          echo "old=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update changelog & extract release notes
        run: >
          node .github/scripts/update-changelog.mjs
          ${{ steps.version.outputs.new }}
          ${{ steps.version.outputs.old }}
          "${{ github.server_url }}/${{ github.repository }}"

      # Package both registries' tarballs without uploading, so a broken
      # manifest aborts the release before anything is tagged or published.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Dry-run npm pack
        run: npm pack --dry-run

      - name: Dry-run JSR publish
        run: deno publish --dry-run --allow-dirty

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json jsr.json CHANGELOG.md
          git commit -m "release: v${{ steps.version.outputs.new }}"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin HEAD --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: v${{ steps.version.outputs.new }}
          body_path: RELEASE_NOTES.md

      # Publishing runs in its own workflow, dispatched on the tag, so the
      # provenance attests the release commit instead of the one before the
      # version bump. A tag pushed with GITHUB_TOKEN triggers no workflows,
      # hence the explicit dispatch.
      - name: Dispatch publish
        run: gh workflow run publish.yml --ref "v${{ steps.version.outputs.new }}"
        env:
          GH_TOKEN: ${{ github.token }}
